name: Python の検証

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: uv の導入
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.16"
      - name: 依存の同期
        run: uv sync --locked
      - name: Notebook の混入確認
        run: |
          if test -n "$(git ls-files '*.ipynb')"; then
            echo 'Notebook は使用しません。Python スクリプトに移してください。'
            exit 1
          fi
      - name: 静的チェック
        run: uv run --locked ruff check scripts tests
      - name: 整形チェック
        run: uv run --locked ruff format --check scripts tests
      - name: 実験基盤のテスト
        run: uv run --locked python -m unittest discover -s tests -v
