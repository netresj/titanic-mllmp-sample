http_port 3128
visible_hostname devcontainer-proxy
pid_filename /tmp/squid.pid

# 管理情報はコンテナ自身のヘルスチェックだけに公開する。
# manager は Squid 5 以降の組み込み ACL のため、ここでは定義しない。
acl loopback src 127.0.0.1/32 ::1
http_access allow loopback manager
http_access deny manager

# 通常の HTTP と HTTPS CONNECT のみを中継する。
acl Safe_ports port 80 443
acl SSL_ports port 443
acl CONNECT method CONNECT
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
# 起動時にリストファイルから生成する。拒否リストを優先する。
include /tmp/domain-access.conf
http_access allow all

# キャッシュとファイルへのログ保存を無効にする。
cache deny all
access_log stdio:/dev/stdout
cache_log /dev/stderr
cache_store_log none
logfile_rotate 0
coredump_dir /tmp
